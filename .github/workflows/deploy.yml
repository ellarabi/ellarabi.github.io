name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check content
        run: node scripts/check.mjs
      # GitHub Pages caches every file for 10 minutes; stamping the commit into
      # the CSS/JS URLs makes browsers fetch fresh copies after each deploy.
      - name: Cache-bust assets
        run: sed -i -E "s#(css/style\.css|js/main\.js)\"#\1?v=${GITHUB_SHA::7}\"#g" site/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
